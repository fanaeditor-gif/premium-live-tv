<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Live TV</title>

<script src="/hls/hls.min.js"></script>

<style>
*{box-sizing:border-box}

:root{
  --bg:#060608;
  --panel:#0d0d11;
  --panel2:#141419;
  --glass:rgba(18,18,23,.78);
  --line:rgba(255,255,255,.09);
  --line2:rgba(255,255,255,.14);
  --text:#f8f8fa;
  --muted:#92929d;
  --red:#ff3b30;
  --green:#32d74b;
  --yellow:#ffd60a;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  overflow:hidden;
  color:var(--text);
  background:#050506;
  font-family:Inter,"Segoe UI",Arial,sans-serif;
}

button,input{font:inherit}

button{
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 5% -10%,rgba(255,59,48,.18),transparent 27%),
    radial-gradient(circle at 100% 10%,rgba(95,85,180,.09),transparent 28%),
    var(--bg);
}

/* HEADER */

.header{
  height:70px;
  flex:none;
  display:flex;
  align-items:center;
  gap:18px;
  padding:0 20px;
  border-bottom:1px solid var(--line);
  background:rgba(7,7,9,.84);
  backdrop-filter:blur(30px);
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:210px;
}

.brand-logo{
  width:39px;
  height:39px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:13px;
  background:linear-gradient(145deg,#ff554c,#c9181e);
  box-shadow:0 9px 30px rgba(255,59,48,.24);
  font-size:12px;
  font-weight:900;
}

.brand-name{
  font-size:16px;
  font-weight:800;
  letter-spacing:-.25px;
}

.brand-sub{
  margin-top:2px;
  color:var(--muted);
  font-size:8px;
  letter-spacing:1.5px;
}

.search-wrap{
  position:relative;
  width:min(430px,40vw);
}

.search{
  width:100%;
  height:42px;
  padding:0 42px 0 39px;
  border:1px solid var(--line);
  border-radius:13px;
  outline:none;
  background:rgba(255,255,255,.055);
  color:white;
  transition:.18s;
}

.search:focus{
  border-color:rgba(255,255,255,.24);
  background:rgba(255,255,255,.075);
}

.search::placeholder{
  color:#777781;
}

.search-icon{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:#8b8b94;
  pointer-events:none;
}

.clear-search{
  position:absolute;
  right:9px;
  top:50%;
  transform:translateY(-50%);
  width:26px;
  height:26px;
  display:none;
  align-items:center;
  justify-content:center;
  border:0;
  border-radius:8px;
  background:rgba(255,255,255,.07);
  color:#aaa;
  cursor:pointer;
}

.header-space{flex:1}

.header-live{
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 12px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(255,255,255,.04);
  color:#c6c6cc;
  font-size:9px;
}

.green-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 11px rgba(50,215,75,.65);
}

/* MAIN */

.main{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:315px minmax(0,1fr);
}

/* SIDEBAR */

.sidebar{
  min-height:0;
  display:flex;
  flex-direction:column;
  border-right:1px solid var(--line);
  background:rgba(10,10,13,.9);
  backdrop-filter:blur(26px);
}

.side-top{
  flex:none;
  padding:15px 14px 10px;
}

.side-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.side-title{
  font-size:14px;
  font-weight:800;
}

#channelCount{
  color:var(--muted);
  font-size:9px;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.tab{
  height:36px;
  border:1px solid var(--line);
  border-radius:10px;
  background:rgba(255,255,255,.04);
  color:#aaa;
  cursor:pointer;
  font-size:9px;
  font-weight:700;
}

.tab.active{
  background:white;
  color:#080808;
}

.groups{
  flex:none;
  display:flex;
  gap:6px;
  padding:0 13px 11px;
  overflow-x:auto;
  border-bottom:1px solid var(--line);
  scrollbar-width:none;
}

.groups::-webkit-scrollbar{display:none}

.group{
  height:30px;
  flex:none;
  padding:0 11px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(255,255,255,.035);
  color:#92929c;
  cursor:pointer;
  font-size:8px;
  font-weight:700;
}

.group:hover{
  background:rgba(255,255,255,.09);
  color:white;
}

.group.active{
  background:rgba(255,59,48,.16);
  border-color:rgba(255,59,48,.28);
  color:#ff8a84;
}

.channels{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:thin;
  overscroll-behavior:contain;
}

.channels::-webkit-scrollbar{width:6px}

.channels::-webkit-scrollbar-thumb{
  border-radius:20px;
  background:rgba(255,255,255,.15);
}

.channel{
  position:relative;
  min-height:65px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 12px;
  border-bottom:1px solid rgba(255,255,255,.045);
  cursor:pointer;
  transition:.15s;
}

.channel:hover,.channel.focused{
  background:rgba(255,255,255,.065);
}

.channel.active{
  background:linear-gradient(90deg,rgba(255,59,48,.17),rgba(255,59,48,.025));
}

.channel.active::before{
  content:"";
  position:absolute;
  left:0;
  top:9px;
  bottom:9px;
  width:3px;
  border-radius:0 4px 4px 0;
  background:var(--red);
}

.ch-logo,.ch-fallback{
  width:44px;
  height:44px;
  flex:none;
  border-radius:11px;
  background:#202025;
  border:1px solid rgba(255,255,255,.05);
}

.ch-logo{
  object-fit:contain;
  padding:4px;
}

.ch-fallback{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:850;
}

.ch-info{
  flex:1;
  min-width:0;
}

.ch-name{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:11px;
  font-weight:700;
}

.ch-group{
  margin-top:5px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  color:var(--muted);
  font-size:8px;
}

.ch-live{
  flex:none;
  color:#ff716a;
  font-size:7px;
  font-weight:900;
}

.ch-star{
  position:absolute;
  right:9px;
  top:6px;
  display:none;
  color:var(--yellow);
  font-size:8px;
}

.channel.favorite .ch-star{display:block}

.empty{
  padding:45px 18px;
  text-align:center;
  color:var(--muted);
  font-size:11px;
  line-height:1.7;
}

/* CONTENT */

.content{
  min-width:0;
  min-height:0;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* PLAYER */

.player{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:22px;
  background:#000;
  box-shadow:0 25px 90px rgba(0,0,0,.42);
}

video{
  position:absolute;
  inset:0;
  z-index:2;
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

.placeholder{
  position:absolute;
  inset:0;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    radial-gradient(circle at center,#1a1a20,#040405 57%);
}

.placeholder-icon{
  width:76px;
  height:76px;
  margin:0 auto 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--line);
  border-radius:24px;
  background:rgba(255,255,255,.055);
  font-size:25px;
}

.placeholder-title{
  font-size:15px;
  font-weight:800;
}

.placeholder-sub{
  margin-top:6px;
  color:var(--muted);
  font-size:9px;
}

.gradient{
  position:absolute;
  z-index:3;
  pointer-events:none;
  left:0;
  right:0;
  bottom:0;
  height:190px;
  background:linear-gradient(transparent,rgba(0,0,0,.91));
}

.live-badge{
  position:absolute;
  z-index:5;
  top:16px;
  left:16px;
  display:none;
  align-items:center;
  gap:6px;
  padding:7px 10px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:8px;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(15px);
  font-size:8px;
  font-weight:900;
}

.red-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--red);
  box-shadow:0 0 10px rgba(255,59,48,.75);
}

.loader{
  position:absolute;
  z-index:10;
  left:50%;
  top:50%;
  display:none;
  transform:translate(-50%,-50%);
  padding:12px 16px;
  border:1px solid var(--line);
  border-radius:11px;
  background:rgba(5,5,7,.84);
  backdrop-filter:blur(20px);
  font-size:10px;
}

.error{
  position:absolute;
  z-index:10;
  left:50%;
  bottom:96px;
  display:none;
  transform:translateX(-50%);
  max-width:calc(100% - 40px);
  padding:10px 14px;
  border:1px solid rgba(255,90,90,.22);
  border-radius:10px;
  background:rgba(55,12,15,.9);
  color:#ffc3c3;
  text-align:center;
  font-size:9px;
}

/* PLAYER INFO */

.player-info{
  position:absolute;
  z-index:5;
  left:20px;
  right:20px;
  bottom:18px;
  display:none;
  align-items:flex-end;
  gap:12px;
}

.now-logo,.now-fallback{
  width:54px;
  height:54px;
  flex:none;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(25,25,30,.92);
}

.now-logo{
  object-fit:contain;
  padding:5px;
}

.now-fallback{
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:850;
}

.now-text{
  flex:1;
  min-width:0;
}

#nowName{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:17px;
  font-weight:800;
}

#nowMeta{
  margin-top:4px;
  color:#aaa;
  font-size:9px;
}

.overlay-buttons{
  display:flex;
  gap:7px;
}

.overlay-btn{
  height:38px;
  min-width:40px;
  padding:0 11px;
  border:1px solid var(--line);
  border-radius:11px;
  background:rgba(20,20,24,.8);
  backdrop-filter:blur(15px);
  color:white;
  cursor:pointer;
}

.overlay-btn:hover{
  background:rgba(255,255,255,.15);
}

.overlay-btn.fav-on{
  color:var(--yellow);
}

/* CONTROL BAR */

.controls{
  min-height:68px;
  flex:none;
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:17px;
  background:rgba(17,17,21,.8);
  backdrop-filter:blur(28px);
}

.ctrl{
  height:42px;
  min-width:44px;
  padding:0 12px;
  border:1px solid var(--line);
  border-radius:11px;
  background:rgba(255,255,255,.05);
  color:white;
  cursor:pointer;
  transition:.15s;
}

.ctrl:hover,.ctrl:focus{
  outline:none;
  background:white;
  color:#080808;
}

.big-play{
  width:48px;
  background:white;
  color:#080808;
  font-weight:900;
}

.play-info{
  flex:1;
  min-width:0;
  padding-left:4px;
}

#controlName{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:11px;
  font-weight:700;
}

#controlStatus{
  margin-top:3px;
  color:var(--muted);
  font-size:8px;
}

.volume-wrap{
  display:flex;
  align-items:center;
  gap:7px;
}

.volume{
  width:100px;
  accent-color:white;
}

@media(max-width:950px){
  .main{
    grid-template-columns:270px minmax(0,1fr);
  }

  .search-wrap{
    width:300px;
  }

  .volume{
    display:none;
  }
}

@media(max-width:760px){
  body{overflow:auto}

  .app{
    height:auto;
    min-height:100vh;
  }

  .header{
    height:auto;
    min-height:65px;
    flex-wrap:wrap;
    padding:11px 13px;
  }

  .brand{
    min-width:0;
  }

  .search-wrap{
    order:3;
    width:100%;
  }

  .header-live{
    margin-left:auto;
  }

  .main{
    display:flex;
    flex-direction:column;
  }

  .content{
    order:1;
    height:55vh;
    flex:none;
    padding:9px;
  }

  .sidebar{
    order:2;
    height:600px;
    flex:none;
    border-right:0;
    border-top:1px solid var(--line);
  }

  .player-info{
    left:12px;
    right:12px;
  }

  .overlay-buttons{
    display:none;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="brand">
    <div class="brand-logo">TV</div>

    <div>
      <div class="brand-name">Live TV</div>
      <div class="brand-sub">WATCH LIVE</div>
    </div>
  </div>

  <div class="search-wrap">
    <span class="search-icon">⌕</span>

    <input
      id="search"
      class="search"
      type="text"
      autocomplete="off"
      placeholder="Search channels..."
    >

    <button
      id="clearSearch"
      class="clear-search"
      onclick="clearSearch()"
    >×</button>
  </div>

  <div class="header-space"></div>

  <div class="header-live">
    <span class="green-dot"></span>
    <span id="topStatus">Starting TV...</span>
  </div>

</header>


<div class="main">

<aside class="sidebar">

  <div class="side-top">

    <div class="side-heading">
      <div class="side-title">Channels</div>
      <div id="channelCount">Loading...</div>
    </div>

    <div class="tabs">

      <button
        id="allTab"
        class="tab active"
        onclick="showAll()"
      >
        Live TV
      </button>

      <button
        id="favTab"
        class="tab"
        onclick="showFavorites()"
      >
        ★ Favorites
      </button>

    </div>

  </div>

  <div
    id="groups"
    class="groups"
  ></div>

  <div
    id="channels"
    class="channels"
  >
    <div class="empty">
      Loading channels...
    </div>
  </div>

</aside>


<main class="content">

  <section
    id="player"
    class="player"
  >

    <video
      id="video"
      playsinline
      preload="auto"
    ></video>

    <div
      id="placeholder"
      class="placeholder"
    >
      <div>
        <div class="placeholder-icon">▶</div>
        <div class="placeholder-title">
          Live TV
        </div>
        <div class="placeholder-sub">
          Select a channel to start watching
        </div>
      </div>
    </div>

    <div class="gradient"></div>

    <div
      id="liveBadge"
      class="live-badge"
    >
      <span class="red-dot"></span>
      LIVE
    </div>

    <div
      id="loader"
      class="loader"
    >
      Connecting...
    </div>

    <div
      id="errorBox"
      class="error"
    ></div>

    <div
      id="playerInfo"
      class="player-info"
    >

      <div id="nowLogoBox"></div>

      <div class="now-text">
        <div id="nowName"></div>
        <div id="nowMeta"></div>
      </div>

      <div class="overlay-buttons">

        <button
          id="favoriteNow"
          class="overlay-btn"
          onclick="toggleFavoriteCurrent()"
          title="Favorite"
        >☆</button>

        <button
          id="overlayMute"
          class="overlay-btn"
          onclick="toggleMute()"
          title="Mute"
        >🔊</button>

        <button
          class="overlay-btn"
          onclick="toggleFullscreen()"
          title="Fullscreen"
        >⛶</button>

      </div>

    </div>

  </section>


  <div class="controls">

    <button
      class="ctrl"
      onclick="previousChannel()"
      title="Previous Channel"
    >◀</button>

    <button
      id="playButton"
      class="ctrl big-play"
      onclick="togglePlay()"
      title="Play/Pause"
    >▶</button>

    <button
      class="ctrl"
      onclick="nextChannel()"
      title="Next Channel"
    >▶</button>

    <div class="play-info">

      <div id="controlName">
        Live TV Ready
      </div>

      <div id="controlStatus">
        Select a channel
      </div>

    </div>

    <div class="volume-wrap">

      <button
        id="muteButton"
        class="ctrl"
        onclick="toggleMute()"
        title="Mute"
      >🔊</button>

      <input
        id="volume"
        class="volume"
        type="range"
        min="0"
        max="1"
        step="0.05"
        value="0.8"
      >

    </div>

    <button
      class="ctrl"
      onclick="toggleFullscreen()"
      title="Fullscreen"
    >⛶</button>

  </div>

</main>

</div>
</div>


<script>

/* =====================================================
   PERMANENT PLAYLIST
===================================================== */

const PLAYLIST_URL =
  "https://iptv-org.github.io/iptv/index.m3u";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
  document.getElementById("video");

const search =
  document.getElementById("search");

const clearSearchButton =
  document.getElementById("clearSearch");

const channelsBox =
  document.getElementById("channels");

const groupsBox =
  document.getElementById("groups");

const channelCount =
  document.getElementById("channelCount");

const topStatus =
  document.getElementById("topStatus");

const loader =
  document.getElementById("loader");

const errorBox =
  document.getElementById("errorBox");

const placeholder =
  document.getElementById("placeholder");

const liveBadge =
  document.getElementById("liveBadge");

const playerInfo =
  document.getElementById("playerInfo");

const nowLogoBox =
  document.getElementById("nowLogoBox");

const nowName =
  document.getElementById("nowName");

const nowMeta =
  document.getElementById("nowMeta");

const controlName =
  document.getElementById("controlName");

const controlStatus =
  document.getElementById("controlStatus");

const playButton =
  document.getElementById("playButton");

const muteButton =
  document.getElementById("muteButton");

const overlayMute =
  document.getElementById("overlayMute");

const volume =
  document.getElementById("volume");

const favoriteNow =
  document.getElementById("favoriteNow");

const allTab =
  document.getElementById("allTab");

const favTab =
  document.getElementById("favTab");


/* =====================================================
   STATE
===================================================== */

let channels = [];

let currentIndex = -1;

let focusedIndex = -1;

let selectedGroup = "All";

let favoritesOnly = false;

let hls = null;

let playbackSession = 0;

let recoveryCount = 0;

let favorites =
  new Set(
    JSON.parse(
      localStorage.getItem(
        "premiumTVFavorites"
      ) || "[]"
    )
  );


/* =====================================================
   HELPERS
===================================================== */

function proxyURL(
  url,
  ua = "",
  referer = ""
){
  const params =
    new URLSearchParams();

  params.set("url",url);

  if(ua){
    params.set("ua",ua);
  }

  if(referer){
    params.set(
      "referer",
      referer
    );
  }

  return (
    "/stream?" +
    params.toString()
  );
}


function showLoader(text){
  loader.textContent =
    text || "Connecting...";

  loader.style.display =
    "block";
}


function hideLoader(){
  loader.style.display =
    "none";
}


function showError(text){
  errorBox.textContent =
    text;

  errorBox.style.display =
    "block";
}


function hideError(){
  errorBox.style.display =
    "none";
}


/* =====================================================
   M3U
===================================================== */

function parseAttributes(line){

  const result = {};

  const regex =
    /([\w-]+)="([^"]*)"/g;

  let match;

  while(
    (
      match =
      regex.exec(line)
    )
  ){
    result[
      match[1].toLowerCase()
    ] = match[2];
  }

  return result;
}


function parseM3U(text){

  const lines =
    text.split(/\r?\n/);

  const output = [];

  let meta = null;


  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const line =
      lines[i].trim();

    if(!line){
      continue;
    }


    if(
      line.startsWith(
        "#EXTINF"
      )
    ){

      const attrs =
        parseAttributes(line);

      const comma =
        line.indexOf(",");

      meta = {

        name:
          comma >= 0
            ? line
                .slice(comma+1)
                .trim()
            : "Channel",

        logo:
          attrs["tvg-logo"] ||
          "",

        group:
          attrs["group-title"] ||
          "Other",

        ua:
          attrs["http-user-agent"] ||
          "",

        referer:
          attrs["http-referrer"] ||
          attrs["http-referer"] ||
          ""
      };

      continue;
    }


    if(
      line.startsWith(
        "#EXTVLCOPT:"
      )
    ){

      if(!meta){
        continue;
      }

      const option =
        line.slice(11);

      const equal =
        option.indexOf("=");

      if(equal < 0){
        continue;
      }

      const key =
        option
          .slice(0,equal)
          .toLowerCase();

      const value =
        option.slice(
          equal+1
        );

      if(
        key ===
        "http-user-agent"
      ){
        meta.ua =
          value;
      }

      if(
        key ===
          "http-referrer" ||
        key ===
          "http-referer"
      ){
        meta.referer =
          value;
      }

      continue;
    }


    if(
      line.startsWith("#")
    ){
      continue;
    }


    if(meta){

      let url = line;

      try{
        url =
          new URL(
            line,
            PLAYLIST_URL
          ).href;
      }catch{}

      output.push({
        ...meta,
        url
      });

      meta = null;
    }
  }

  return output;
}


/* =====================================================
   LOAD TV
===================================================== */

async function loadTV(){

  showLoader(
    "Loading channels..."
  );

  topStatus.textContent =
    "Loading...";

  try{

    const response =
      await fetch(
        "/playlist?url=" +
        encodeURIComponent(
          PLAYLIST_URL
        )
      );

    if(!response.ok){
      throw new Error(
        "Could not load channels"
      );
    }

    const text =
      await response.text();

    channels =
      parseM3U(text);

    if(!channels.length){
      throw new Error(
        "No channels found"
      );
    }

    createGroups();

    renderChannels();

    topStatus.textContent =
      channels.length +
      " channels";

    hideLoader();


    /*
      Restore last watched channel.

      Browser may block unmuted autoplay,
      so we try normally and leave a clean
      Play button if interaction is needed.
    */

    const last =
      localStorage.getItem(
        "premiumTVLastChannel"
      );

    if(last){

      const index =
        channels.findIndex(
          c => c.url === last
        );

      if(index >= 0){

        setTimeout(
          () =>
            playChannel(
              index,
              false
            ),
          250
        );

        return;
      }
    }

    controlName.textContent =
      "Live TV Ready";

    controlStatus.textContent =
      "Select a channel";

  }catch(error){

    hideLoader();

    topStatus.textContent =
      "Offline";

    showError(
      error.message
    );
  }
}


/* =====================================================
   GROUPS / FILTERS
===================================================== */

function createGroups(){

  const groups = [
    "All",
    ...new Set(
      channels
        .map(c => c.group)
        .filter(Boolean)
    )
  ];

  groupsBox.innerHTML =
    "";

  groups.forEach(
    group => {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "group" +
        (
          !favoritesOnly &&
          group === selectedGroup
            ? " active"
            : ""
        );

      button.textContent =
        group;

      button.onclick =
        () => {

          favoritesOnly =
            false;

          selectedGroup =
            group;

          updateTabs();

          createGroups();

          renderChannels();
        };

      groupsBox.appendChild(
        button
      );
    }
  );
}


function showAll(){

  favoritesOnly = false;

  selectedGroup = "All";

  updateTabs();

  createGroups();

  renderChannels();
}


function showFavorites(){

  favoritesOnly = true;

  updateTabs();

  createGroups();

  renderChannels();
}


function updateTabs(){

  allTab.classList.toggle(
    "active",
    !favoritesOnly
  );

  favTab.classList.toggle(
    "active",
    favoritesOnly
  );
}


function getVisibleChannels(){

  const query =
    search.value
      .trim()
      .toLowerCase();

  return channels
    .map(
      (channel,index) => ({
        channel,
        index
      })
    )
    .filter(
      ({channel}) => {

        if(
          favoritesOnly &&
          !favorites.has(
            channel.url
          )
        ){
          return false;
        }

        if(
          !favoritesOnly &&
          selectedGroup !==
            "All" &&
          channel.group !==
            selectedGroup
        ){
          return false;
        }

        if(
          query &&
          !channel.name
            .toLowerCase()
            .includes(query) &&
          !channel.group
            .toLowerCase()
            .includes(query)
        ){
          return false;
        }

        return true;
      }
    );
}


/* =====================================================
   CHANNEL LIST
===================================================== */

function renderChannels(){

  const visible =
    getVisibleChannels();

  channelCount.textContent =
    visible.length +
    " channels";

  channelsBox.innerHTML =
    "";

  if(!visible.length){

    channelsBox.innerHTML =
      '<div class="empty">No channels found.<br>Try another category or search.</div>';

    return;
  }

  const fragment =
    document.createDocumentFragment();

  visible.forEach(
    ({channel,index}) => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "channel";

      row.dataset.index =
        index;

      if(
        index ===
        currentIndex
      ){
        row.classList.add(
          "active"
        );
      }

      if(
        favorites.has(
          channel.url
        )
      ){
        row.classList.add(
          "favorite"
        );
      }

      let logo;

      if(channel.logo){

        logo =
          document.createElement(
            "img"
          );

        logo.className =
          "ch-logo";

        logo.src =
          channel.logo;

        logo.loading =
          "lazy";

        logo.onerror =
          () => {

            logo.replaceWith(
              makeFallback(
                channel.name,
                "ch-fallback"
              )
            );
          };

      }else{

        logo =
          makeFallback(
            channel.name,
            "ch-fallback"
          );
      }


      const info =
        document.createElement(
          "div"
        );

      info.className =
        "ch-info";


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "ch-name";

      name.textContent =
        channel.name;


      const group =
        document.createElement(
          "div"
        );

      group.className =
        "ch-group";

      group.textContent =
        channel.group;


      const live =
        document.createElement(
          "div"
        );

      live.className =
        "ch-live";

      live.textContent =
        "LIVE";


      const star =
        document.createElement(
          "div"
        );

      star.className =
        "ch-star";

      star.textContent =
        "★";


      info.appendChild(name);

      info.appendChild(group);

      row.appendChild(logo);

      row.appendChild(info);

      row.appendChild(live);

      row.appendChild(star);


      row.onclick =
        () =>
          playChannel(
            index,
            true
          );


      fragment.appendChild(
        row
      );
    }
  );

  channelsBox.appendChild(
    fragment
  );
}


function makeFallback(
  name,
  className
){

  const box =
    document.createElement(
      "div"
    );

  box.className =
    className;

  box.textContent =
    (
      name || "TV"
    )
      .charAt(0)
      .toUpperCase();

  return box;
}


/* =====================================================
   NOW PLAYING
===================================================== */

function updateNow(channel){

  nowLogoBox.innerHTML =
    "";

  let logo;

  if(channel.logo){

    logo =
      document.createElement(
        "img"
      );

    logo.className =
      "now-logo";

    logo.src =
      channel.logo;

    logo.onerror =
      () => {

        logo.replaceWith(
          makeFallback(
            channel.name,
            "now-fallback"
          )
        );
      };

  }else{

    logo =
      makeFallback(
        channel.name,
        "now-fallback"
      );
  }

  nowLogoBox.appendChild(
    logo
  );

  nowName.textContent =
    channel.name;

  nowMeta.textContent =
    channel.group +
    " • Live TV";

  controlName.textContent =
    channel.name;

  controlStatus.textContent =
    "Connecting...";

  playerInfo.style.display =
    "flex";

  updateFavoriteButton();
}


/* =====================================================
   AUDIO
===================================================== */

function savedVolume(){

  const stored =
    Number(
      localStorage.getItem(
        "premiumTVVolume"
      )
    );

  if(
    Number.isFinite(stored) &&
    stored > 0 &&
    stored <= 1
  ){
    return stored;
  }

  return .8;
}


function enableAudio(){

  const level =
    savedVolume();

  video.muted = false;

  video.volume =
    level;

  volume.value =
    level;

  updateAudioIcons();
}


function updateAudioIcons(){

  const muted =
    video.muted ||
    video.volume === 0;

  const icon =
    muted
      ? "🔇"
      : "🔊";

  muteButton.textContent =
    icon;

  overlayMute.textContent =
    icon;
}


function toggleMute(){

  if(
    video.muted ||
    video.volume === 0
  ){

    video.muted = false;

    if(video.volume === 0){
      video.volume =
        savedVolume();
    }

  }else{

    video.muted = true;
  }

  updateAudioIcons();
}


/* =====================================================
   PLAY CHANNEL
===================================================== */

function playChannel(
  index,
  userAction = true
){

  const channel =
    channels[index];

  if(!channel){
    return;
  }

  playbackSession++;

  const session =
    playbackSession;

  currentIndex =
    index;

  focusedIndex =
    index;

  recoveryCount = 0;

  localStorage.setItem(
    "premiumTVLastChannel",
    channel.url
  );

  hideError();

  placeholder.style.display =
    "none";

  liveBadge.style.display =
    "none";

  updateNow(channel);

  renderChannels();

  showLoader(
    "Connecting..."
  );


  /*
    Channel click is a user gesture,
    so restore sound here.
  */

  if(userAction){
    enableAudio();
  }


  startStream(
    channel,
    session,
    userAction
  );
}


/* =====================================================
   HLS PLAYBACK
===================================================== */

function startStream(
  channel,
  session,
  userAction
){

  destroyPlayer();

  const source =
    proxyURL(
      channel.url,
      channel.ua,
      channel.referer
    );


  if(
    window.Hls &&
    Hls.isSupported()
  ){

    hls =
      new Hls({

        enableWorker:true,

        lowLatencyMode:false,

        backBufferLength:30,

        maxBufferLength:30,

        maxMaxBufferLength:60,

        manifestLoadingTimeOut:
          20000,

        manifestLoadingMaxRetry:
          3,

        levelLoadingTimeOut:
          20000,

        levelLoadingMaxRetry:
          3,

        fragLoadingTimeOut:
          25000,

        fragLoadingMaxRetry:
          4
      });


    hls.attachMedia(
      video
    );


    hls.on(
      Hls.Events.MEDIA_ATTACHED,
      () => {

        if(
          session !==
          playbackSession
        ){
          return;
        }

        hls.loadSource(
          source
        );
      }
    );


    hls.on(
      Hls.Events.MANIFEST_PARSED,
      async () => {

        if(
          session !==
          playbackSession
        ){
          return;
        }

        try{

          if(userAction){
            enableAudio();
          }

          await video.play();

          hideLoader();

          hideError();

          liveBadge.style.display =
            "flex";

          controlStatus.textContent =
            channel.group +
            " • LIVE";

          playButton.textContent =
            "❚❚";

          topStatus.textContent =
            "Watching " +
            channel.name;

        }catch{

          /*
            Browser blocked autoplay.
            Do not force mute.
          */

          hideLoader();

          controlStatus.textContent =
            "Press Play to start";

          playButton.textContent =
            "▶";
        }
      }
    );


    hls.on(
      Hls.Events.ERROR,
      (event,data) => {

        if(
          session !==
          playbackSession
        ){
          return;
        }

        if(!data.fatal){
          return;
        }


        if(
          data.type ===
          Hls.ErrorTypes.MEDIA_ERROR &&
          recoveryCount < 2
        ){

          recoveryCount++;

          controlStatus.textContent =
            "Recovering...";

          try{
            hls.recoverMediaError();
            return;
          }catch{}
        }


        if(
          data.type ===
          Hls.ErrorTypes.NETWORK_ERROR &&
          recoveryCount < 2
        ){

          recoveryCount++;

          controlStatus.textContent =
            "Reconnecting...";

          try{
            hls.startLoad();
            return;
          }catch{}
        }


        hideLoader();

        liveBadge.style.display =
          "none";

        controlStatus.textContent =
          "Currently unavailable";

        showError(
          "This channel is currently unavailable. Try another channel."
        );
      }
    );


  }else if(
    video.canPlayType(
      "application/vnd.apple.mpegurl"
    )
  ){

    video.src =
      source;

    if(userAction){
      enableAudio();
    }

    video.play()
      .then(
        () => {

          hideLoader();

          liveBadge.style.display =
            "flex";

          playButton.textContent =
            "❚❚";
        }
      )
      .catch(
        () => {

          hideLoader();

          controlStatus.textContent =
            "Press Play to start";
        }
      );

  }else{

    hideLoader();

    showError(
      "Live playback is not supported by this browser."
    );
  }
}


function destroyPlayer(){

  if(hls){

    try{
      hls.destroy();
    }catch{}

    hls = null;
  }

  try{
    video.pause();
    video.removeAttribute("src");
    video.load();
  }catch{}
}


/* =====================================================
   CONTROLS
===================================================== */

async function togglePlay(){

  if(currentIndex < 0){
    return;
  }

  if(video.paused){

    /*
      Play button is user interaction:
      enable audio safely.
    */

    enableAudio();

    try{

      await video.play();

      playButton.textContent =
        "❚❚";

    }catch{}

  }else{

    video.pause();

    playButton.textContent =
      "▶";
  }
}


function nextChannel(){

  if(!channels.length){
    return;
  }

  const next =
    currentIndex < 0
      ? 0
      : (
          currentIndex + 1
        ) %
        channels.length;

  playChannel(
    next,
    true
  );
}


function previousChannel(){

  if(!channels.length){
    return;
  }

  const previous =
    currentIndex <= 0
      ? channels.length - 1
      : currentIndex - 1;

  playChannel(
    previous,
    true
  );
}


async function toggleFullscreen(){

  const player =
    document.getElementById(
      "player"
    );

  try{

    if(
      document.fullscreenElement
    ){

      await document
        .exitFullscreen();

    }else{

      await player
        .requestFullscreen();
    }

  }catch{}
}


/* =====================================================
   FAVORITES
===================================================== */

function saveFavorites(){

  localStorage.setItem(
    "premiumTVFavorites",
    JSON.stringify(
      [...favorites]
    )
  );
}


function toggleFavoriteCurrent(){

  if(currentIndex < 0){
    return;
  }

  const channel =
    channels[currentIndex];

  if(
    favorites.has(
      channel.url
    )
  ){

    favorites.delete(
      channel.url
    );

  }else{

    favorites.add(
      channel.url
    );
  }

  saveFavorites();

  updateFavoriteButton();

  renderChannels();
}


function updateFavoriteButton(){

  if(currentIndex < 0){
    return;
  }

  const active =
    favorites.has(
      channels[currentIndex].url
    );

  favoriteNow.textContent =
    active
      ? "★"
      : "☆";

  favoriteNow.classList.toggle(
    "fav-on",
    active
  );
}


/* =====================================================
   SEARCH
===================================================== */

search.addEventListener(
  "input",
  () => {

    clearSearchButton.style.display =
      search.value
        ? "flex"
        : "none";

    renderChannels();
  }
);


function clearSearch(){

  search.value = "";

  clearSearchButton.style.display =
    "none";

  renderChannels();

  search.focus();
}


/* =====================================================
   VOLUME
===================================================== */

volume.addEventListener(
  "input",
  () => {

    const value =
      Number(
        volume.value
      );

    video.volume =
      value;

    video.muted =
      value === 0;

    if(value > 0){

      localStorage.setItem(
        "premiumTVVolume",
        value
      );
    }

    updateAudioIcons();
  }
);


video.addEventListener(
  "volumechange",
  () => {

    volume.value =
      video.volume;

    if(
      video.volume > 0 &&
      !video.muted
    ){

      localStorage.setItem(
        "premiumTVVolume",
        video.volume
      );
    }

    updateAudioIcons();
  }
);


/* =====================================================
   VIDEO EVENTS
===================================================== */

video.addEventListener(
  "playing",
  () => {

    hideLoader();

    hideError();

    liveBadge.style.display =
      "flex";

    playButton.textContent =
      "❚❚";
  }
);


video.addEventListener(
  "pause",
  () => {

    playButton.textContent =
      "▶";
  }
);


video.addEventListener(
  "waiting",
  () => {

    if(currentIndex >= 0){

      showLoader(
        "Buffering..."
      );

      controlStatus.textContent =
        "Buffering...";
    }
  }
);


/* =====================================================
   KEYBOARD / TV REMOTE
===================================================== */

function moveFocus(direction){

  const visible =
    getVisibleChannels();

  if(!visible.length){
    return;
  }

  let position =
    visible.findIndex(
      item =>
        item.index ===
        focusedIndex
    );

  if(position < 0){
    position = 0;
  }else{
    position += direction;
  }

  if(position < 0){
    position =
      visible.length - 1;
  }

  if(
    position >=
    visible.length
  ){
    position = 0;
  }

  focusedIndex =
    visible[position].index;

  document
    .querySelectorAll(
      ".channel"
    )
    .forEach(
      item =>
        item.classList.remove(
          "focused"
        )
    );

  const element =
    document.querySelector(
      '.channel[data-index="' +
      focusedIndex +
      '"]'
    );

  if(element){

    element.classList.add(
      "focused"
    );

    element.scrollIntoView({
      block:"nearest"
    });
  }
}


document.addEventListener(
  "keydown",
  event => {

    /*
      Don't hijack arrows while typing search.
    */

    if(
      document.activeElement ===
      search
    ){

      if(
        event.key ===
        "Escape"
      ){

        search.blur();
      }

      return;
    }


    if(
      event.key ===
      "ArrowDown"
    ){

      event.preventDefault();

      moveFocus(1);

      return;
    }


    if(
      event.key ===
      "ArrowUp"
    ){

      event.preventDefault();

      moveFocus(-1);

      return;
    }


    if(
      event.key ===
      "Enter" &&
      focusedIndex >= 0
    ){

      event.preventDefault();

      playChannel(
        focusedIndex,
        true
      );

      return;
    }


    if(
      event.code ===
      "Space"
    ){

      event.preventDefault();

      togglePlay();

      return;
    }


    if(
      event.key.toLowerCase() ===
      "m"
    ){

      toggleMute();

      return;
    }


    if(
      event.key.toLowerCase() ===
      "f"
    ){

      toggleFullscreen();

      return;
    }


    if(
      event.key === "/"
    ){

      event.preventDefault();

      search.focus();
    }
  }
);


/* =====================================================
   START
===================================================== */

window.addEventListener(
  "DOMContentLoaded",
  () => {

    /*
      IMPORTANT:
      Do not restore a saved muted state.
      Start with normal volume.
    */

    const initialVolume =
      savedVolume();

    video.volume =
      initialVolume;

    video.muted =
      false;

    volume.value =
      initialVolume;

    updateAudioIcons();

    loadTV();
  }
);

</script>
