<meta name="theme-color" content="#0a0612">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{box-sizing:border-box}
:root{
  --bg:#0a0612;--panel:#120b20;--panel2:#1a1030;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
  --text:#fbf9ff;--muted:#9a90b3;
  --pink:#ff2d87;--violet:#7b3cff;--red:#ff3b30;--green:#32d74b;--yellow:#ffd60a;
  --grad:linear-gradient(135deg,#ff2d87,#7b3cff);
  --ease:cubic-bezier(.2,.8,.2,1);
}
html,body{width:100%;height:100%;margin:0}
body{overflow:hidden;color:var(--text);background:var(--bg);
  font-family:"Plus Jakarta Sans",Inter,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

.app{width:100%;height:100%;display:flex;flex-direction:column;
  background:
    radial-gradient(900px 480px at 0% -12%,rgba(255,45,135,.22),transparent 60%),
    radial-gradient(800px 520px at 100% 0%,rgba(123,60,255,.2),transparent 60%),
    var(--bg)}

/* HEADER */
.header{height:66px;flex:none;display:flex;align-items:center;gap:20px;padding:0 24px;
  border-bottom:1px solid var(--line);background:rgba(10,6,18,.72);backdrop-filter:blur(28px);z-index:20}
.brand{display:flex;align-items:center;gap:12px;min-width:210px}
.brand-logo{width:40px;height:40px;position:relative;font-size:0;border-radius:13px;
  background:var(--grad);box-shadow:0 8px 28px rgba(255,45,135,.35)}
.brand-logo::after{content:"";position:absolute;left:15px;top:12px;width:14px;height:16px;background:#fff;
  clip-path:polygon(0 0,100% 50%,0 100%)}
.brand-name{font-size:18px;font-weight:800;letter-spacing:-.4px}
.brand-sub{margin-top:2px;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.3px}

.search-wrap{position:relative;width:min(460px,40vw)}
.search{width:100%;height:44px;padding:0 44px 0 42px;border:1px solid var(--line);border-radius:999px;outline:none;
  background:rgba(255,255,255,.06);color:#fff;font-size:14px;transition:.2s}
.search:focus{border-color:rgba(255,45,135,.55);background:rgba(255,255,255,.09);box-shadow:0 0 0 4px rgba(255,45,135,.12)}
.search::placeholder{color:#7d7396}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#9a90b3;font-size:18px;pointer-events:none}
.clear-search{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:28px;height:28px;display:none;
  align-items:center;justify-content:center;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#ccc;cursor:pointer}
.header-space{flex:1}
.header-live{display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;
  background:rgba(255,255,255,.05);color:#d8d2e8;font-size:12px;font-weight:600;max-width:320px}
.header-live #topStatus{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.green-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px rgba(50,215,75,.7)}

/* MAIN */
.main{flex:1;min-height:0;display:grid;grid-template-columns:340px minmax(0,1fr)}

/* SIDEBAR */
.sidebar{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line);
  background:rgba(14,8,26,.72);backdrop-filter:blur(26px)}
.side-top{flex:none;padding:18px 16px 12px}
.side-heading{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.side-title{font-size:20px;font-weight:800;letter-spacing:-.4px}
#channelCount{color:var(--muted);font-size:12px;font-weight:600}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.06)}
.tab{height:36px;border:0;border-radius:11px;background:transparent;color:#b3a9cc;cursor:pointer;font-size:13px;font-weight:700;transition:.2s}
.tab:hover{color:#fff}
.tab.active{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(255,45,135,.3)}

.groups{flex:none;display:flex;gap:8px;padding:0 16px 14px;overflow-x:auto;scrollbar-width:none}
.groups::-webkit-scrollbar{display:none}
.group{height:32px;flex:none;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.04);
  color:#aaa0c4;cursor:pointer;font-size:12px;font-weight:600;transition:.2s}
.group:hover{background:rgba(255,255,255,.1);color:#fff}
.group.active{background:#fff;border-color:#fff;color:#14081f}

/* CHANNEL TILES */
.channels{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;
  align-content:start;padding:4px 16px 20px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.channels::-webkit-scrollbar{width:6px}
.channels::-webkit-scrollbar-thumb{border-radius:20px;background:rgba(255,255,255,.18)}

.channel{position:relative;min-height:0;display:flex;flex-direction:column;align-items:stretch;gap:9px;padding:10px;
  border:1px solid var(--line);border-radius:16px;background:var(--panel2);cursor:pointer;
  transition:transform .2s var(--ease),border-color .2s,background .2s}
.channel:hover,.channel.focused{background:#241545;border-color:var(--line2);transform:translateY(-2px)}
.channel.active{background:linear-gradient(160deg,rgba(255,45,135,.28),rgba(123,60,255,.2));
  border-color:rgba(255,45,135,.7);box-shadow:0 10px 30px rgba(255,45,135,.22)}
.channel.focused{outline:2px solid #fff;outline-offset:1px}

.ch-logo,.ch-fallback{width:100%;height:68px;flex:none;border-radius:11px;background:rgba(255,255,255,.07);border:0}
.ch-logo{object-fit:contain;padding:9px}
.ch-fallback{display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;background:var(--grad);color:#fff}
.ch-info{flex:none;min-width:0}
.ch-name{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px;font-weight:700}
.ch-group{margin-top:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--muted);font-size:11px}
.ch-live{position:absolute;left:16px;top:16px;display:none;align-items:center;gap:5px;padding:3px 7px;border-radius:6px;
  background:rgba(0,0,0,.65);color:#fff;font-size:9px;font-weight:800;letter-spacing:.4px}
.ch-live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}
.channel.active .ch-live{display:flex}
.ch-star{position:absolute;right:16px;top:14px;display:none;color:var(--yellow);font-size:13px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.channel.favorite .ch-star{display:block}
.empty{grid-column:1/-1;padding:50px 18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}

/* CONTENT */
.content{min-width:0;min-height:0;padding:20px;display:flex;flex-direction:column;gap:14px}

/* PLAYER */
.player{position:relative;flex:1;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:24px;background:#000;
  box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.02),0 0 120px rgba(123,60,255,.12)}
video{position:absolute;inset:0;z-index:2;width:100%;height:100%;object-fit:contain;background:#000}
.placeholder{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(circle at 50% 45%,rgba(123,60,255,.28),transparent 55%),radial-gradient(circle at 50% 100%,rgba(255,45,135,.16),transparent 50%),#07040d}
.placeholder-icon{width:84px;height:84px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:var(--grad);font-size:28px;padding-left:5px;box-shadow:0 14px 50px rgba(255,45,135,.4)}
.placeholder-title{font-size:22px;font-weight:800;letter-spacing:-.4px}
.placeholder-sub{margin-top:8px;color:var(--muted);font-size:14px}
.gradient{position:absolute;z-index:3;pointer-events:none;left:0;right:0;bottom:0;height:220px;
  background:linear-gradient(transparent,rgba(5,2,10,.92))}
.live-badge{position:absolute;z-index:5;top:18px;left:18px;display:none;align-items:center;gap:7px;padding:7px 12px;
  border-radius:8px;background:rgba(0,0,0,.62);backdrop-filter:blur(14px);font-size:11px;font-weight:800;letter-spacing:.5px}
.red-dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 10px rgba(255,59,48,.8)}
.loader{position:absolute;z-index:10;left:50%;top:50%;display:none;transform:translate(-50%,-50%);padding:13px 20px;
  border:1px solid var(--line);border-radius:999px;background:rgba(10,6,18,.82);backdrop-filter:blur(20px);font-size:13px;font-weight:600}
.error{position:absolute;z-index:10;left:50%;bottom:104px;display:none;transform:translateX(-50%);max-width:calc(100% - 40px);
  padding:11px 16px;border:1px solid rgba(255,90,110,.3);border-radius:12px;background:rgba(60,10,28,.92);color:#ffc7d2;
  text-align:center;font-size:13px}

/* NOW PLAYING */
.player-info{position:absolute;z-index:5;left:24px;right:24px;bottom:22px;display:none;align-items:flex-end;gap:14px}
.now-logo,.now-fallback{width:60px;height:60px;flex:none;border-radius:16px;background:rgba(255,255,255,.12);border:1px solid var(--line)}
.now-logo{object-fit:contain;padding:7px}
.now-fallback{display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;background:var(--grad);border:0}
.now-text{flex:1;min-width:0}
#nowName{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:24px;font-weight:800;letter-spacing:-.5px}
#nowMeta{margin-top:5px;color:#c9c0de;font-size:13px;font-weight:500}
.overlay-buttons{display:flex;gap:8px}
.overlay-btn{width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:50%;background:rgba(20,12,36,.7);
  backdrop-filter:blur(15px);color:#fff;font-size:16px;cursor:pointer;transition:.2s}
.overlay-btn:hover{background:rgba(255,255,255,.2)}
.overlay-btn.fav-on{color:var(--yellow);border-color:rgba(255,214,10,.4)}

/* CONTROL BAR */
.controls{min-height:70px;flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px;
  border:1px solid var(--line);border-radius:999px;background:rgba(22,13,40,.78);backdrop-filter:blur(28px)}
.ctrl{height:44px;min-width:44px;padding:0 14px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.06);
  color:#fff;cursor:pointer;transition:.2s}
.ctrl:hover,.ctrl:focus-visible{background:rgba(255,255,255,.95);color:#14081f}
.big-play{width:52px;height:52px;padding:0;border:0;background:var(--grad);color:#fff;font-weight:900;
  box-shadow:0 8px 24px rgba(255,45,135,.4)}
.big-play:hover,.big-play:focus-visible{background:var(--grad);color:#fff;transform:scale(1.06)}
.play-info{flex:1;min-width:0;padding-left:8px}
#controlName{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:14px;font-weight:700}
#controlStatus{margin-top:3px;color:var(--muted);font-size:12px}
.volume-wrap{display:flex;align-items:center;gap:8px}
.volume{width:110px;accent-color:var(--pink)}

@media(max-width:950px){
  .main{grid-template-columns:290px minmax(0,1fr)}
  .search-wrap{width:300px}
  .volume{display:none}
}
@media(max-width:760px){
  body{overflow:auto}
  .app{height:auto;min-height:100vh}
  .header{height:auto;min-height:64px;flex-wrap:wrap;padding:11px 14px;gap:12px}
  .brand{min-width:0}
  .search-wrap{order:3;width:100%}
  .header-live{margin-left:auto}
  .main{display:flex;flex-direction:column}
  .content{order:1;height:58vh;flex:none;padding:10px}
  .sidebar{order:2;height:640px;flex:none;border-right:0;border-top:1px solid var(--line)}
  .player{border-radius:18px}
  .player-info{left:14px;right:14px;bottom:14px}
  #nowName{font-size:18px}
  .overlay-buttons{display:none}
  .controls{border-radius:22px;padding:8px 10px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* BROWSE MODE: player hidden until a channel is opened */
body.idle .content{display:none}
body.idle .main{grid-template-columns:minmax(0,1fr)}
body.idle .sidebar{border-right:0;background:transparent}
body.idle .side-top{padding:26px 28px 14px;max-width:1400px;width:100%;margin:0 auto}
body.idle .groups{padding:0 28px 16px;max-width:1400px;width:100%;margin:0 auto}
body.idle .side-title{font-size:26px}
body.idle .tabs{max-width:340px}
body.idle .channels{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:6px 28px 28px;
  max-width:1400px;width:100%;margin:0 auto}
body.idle .ch-logo,body.idle .ch-fallback{height:88px}
@media(max-width:760px){
  body.idle .sidebar{height:auto;min-height:calc(100vh - 120px);border-top:0}
  body.idle .side-top,body.idle .groups{padding-left:14px;padding-right:14px}
  body.idle .channels{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));padding:6px 14px 24px}
}
</style>

<script>

/* =====================================================
   PERMANENT PLAYLIST
===================================================== */

const AUTO_RESUME = false;

const PLAYLIST_URL =
  "https://iptv-org.github.io/iptv/index.m3u";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
  document.getElementById("video");

const search =
  document.getElementById("search");

const clearSearchButton =
  document.getElementById("clearSearch");

const channelsBox =
  document.getElementById("channels");

const groupsBox =
  document.getElementById("groups");

const channelCount =
  document.getElementById("channelCount");

const topStatus =
  document.getElementById("topStatus");

const loader =
  document.getElementById("loader");

const errorBox =
  document.getElementById("errorBox");

const placeholder =
  document.getElementById("placeholder");

const liveBadge =
  document.getElementById("liveBadge");

const playerInfo =
  document.getElementById("playerInfo");

const nowLogoBox =
  document.getElementById("nowLogoBox");

const nowName =
  document.getElementById("nowName");

const nowMeta =
  document.getElementById("nowMeta");

const controlName =
  document.getElementById("controlName");

const controlStatus =
  document.getElementById("controlStatus");

const playButton =
  document.getElementById("playButton");

const muteButton =
  document.getElementById("muteButton");

const overlayMute =
  document.getElementById("overlayMute");

const volume =
  document.getElementById("volume");

const favoriteNow =
  document.getElementById("favoriteNow");

const allTab =
  document.getElementById("allTab");

const favTab =
  document.getElementById("favTab");


/* =====================================================
   STATE
===================================================== */

let channels = [];

let currentIndex = -1;

let focusedIndex = -1;

let selectedGroup = "All";

let favoritesOnly = false;

let hls = null;

let playbackSession = 0;

let recoveryCount = 0;

let favorites =
  new Set(
    JSON.parse(
      localStorage.getItem(
        "premiumTVFavorites"
      ) || "[]"
    )
  );


/* =====================================================
   HELPERS
===================================================== */

function proxyURL(
  url,
  ua = "",
  referer = ""
){
  const params =
    new URLSearchParams();

  params.set("url",url);

  if(ua){
    params.set("ua",ua);
  }

  if(referer){
    params.set(
      "referer",
      referer
    );
  }

  return (
    "/stream?" +
    params.toString()
  );
}


function showLoader(text){
  loader.textContent =
    text || "Connecting...";

  loader.style.display =
    "block";
}


function hideLoader(){
  loader.style.display =
    "none";
}


function showError(text){
  errorBox.textContent =
    text;

  errorBox.style.display =
    "block";
}


function hideError(){
  errorBox.style.display =
    "none";
}


/* =====================================================
   M3U
===================================================== */

function parseAttributes(line){

  const result = {};

  const regex =
    /([\w-]+)="([^"]*)"/g;

  let match;

  while(
    (
      match =
      regex.exec(line)
    )
  ){
    result[
      match[1].toLowerCase()
    ] = match[2];
  }

  return result;
}


function parseM3U(text){

  const lines =
    text.split(/\r?\n/);

  const output = [];

  let meta = null;


  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const line =
      lines[i].trim();

    if(!line){
      continue;
    }


    if(
      line.startsWith(
        "#EXTINF"
      )
    ){

      const attrs =
        parseAttributes(line);

      const comma =
        line.indexOf(",");

      meta = {

        name:
          comma >= 0
            ? line
                .slice(comma+1)
                .trim()
            : "Channel",

        logo:
          attrs["tvg-logo"] ||
          "",

        group:
          attrs["group-title"] ||
          "Other",

        ua:
          attrs["http-user-agent"] ||
          "",

        referer:
          attrs["http-referrer"] ||
          attrs["http-referer"] ||
          ""
      };

      continue;
    }


    if(
      line.startsWith(
        "#EXTVLCOPT:"
      )
    ){

      if(!meta){
        continue;
      }

      const option =
        line.slice(11);

      const equal =
        option.indexOf("=");

      if(equal < 0){
        continue;
      }

      const key =
        option
          .slice(0,equal)
          .toLowerCase();

      const value =
        option.slice(
          equal+1
        );

      if(
        key ===
        "http-user-agent"
      ){
        meta.ua =
          value;
      }

      if(
        key ===
          "http-referrer" ||
        key ===
          "http-referer"
      ){
        meta.referer =
          value;
      }

      continue;
    }


    if(
      line.startsWith("#")
    ){
      continue;
    }


    if(meta){

      let url = line;

      try{
        url =
          new URL(
            line,
            PLAYLIST_URL
          ).href;
      }catch{}

      output.push({
        ...meta,
        url
      });

      meta = null;
    }
  }

  return output;
}


/* =====================================================
   LOAD TV
===================================================== */

async function loadTV(){

  showLoader(
    "Loading channels..."
  );

  topStatus.textContent =
    "Loading...";

  try{

    const response =
      await fetch(
        "/playlist?url=" +
        encodeURIComponent(
          PLAYLIST_URL
        )
      );

    if(!response.ok){
      throw new Error(
        "Could not load channels"
      );
    }

    const text =
      await response.text();

    channels =
      parseM3U(text);

    if(!channels.length){
      throw new Error(
        "No channels found"
      );
    }

    createGroups();

    renderChannels();

    topStatus.textContent =
      channels.length +
      " channels";

    hideLoader();


    /*
      Restore last watched channel.

      Browser may block unmuted autoplay,
      so we try normally and leave a clean
      Play button if interaction is needed.
    */

    const last =
      localStorage.getItem(
        "premiumTVLastChannel"
      );

    if(AUTO_RESUME && last){

      const index =
        channels.findIndex(
          c => c.url === last
        );

      if(index >= 0){

        setTimeout(
          () =>
            playChannel(
              index,
              false
            ),
          250
        );

        return;
      }
    }

    controlName.textContent =
      "Live TV Ready";

    controlStatus.textContent =
      "Select a channel";

  }catch(error){

    hideLoader();

    topStatus.textContent =
      "Offline";

    showError(
      error.message
    );
  }
}


/* =====================================================
   GROUPS / FILTERS
===================================================== */

function createGroups(){

  const groups = [
    "All",
    ...new Set(
      channels
        .map(c => c.group)
        .filter(Boolean)
    )
  ];

  groupsBox.innerHTML =
    "";

  groups.forEach(
    group => {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "group" +
        (
          !favoritesOnly &&
          group === selectedGroup
            ? " active"
            : ""
        );

      button.textContent =
        group;

      button.onclick =
        () => {

          favoritesOnly =
            false;

          selectedGroup =
            group;

          updateTabs();

          createGroups();

          renderChannels();
        };

      groupsBox.appendChild(
        button
      );
    }
  );
}


function showAll(){

  favoritesOnly = false;

  selectedGroup = "All";

  updateTabs();

  createGroups();

  renderChannels();
}


function showFavorites(){

  favoritesOnly = true;

  updateTabs();

  createGroups();

  renderChannels();
}


function updateTabs(){

  allTab.classList.toggle(
    "active",
    !favoritesOnly
  );

  favTab.classList.toggle(
    "active",
    favoritesOnly
  );
}


function getVisibleChannels(){

  const query =
    search.value
      .trim()
      .toLowerCase();

  return channels
    .map(
      (channel,index) => ({
        channel,
        index
      })
    )
    .filter(
      ({channel}) => {

        if(
          favoritesOnly &&
          !favorites.has(
            channel.url
          )
        ){
          return false;
        }

        if(
          !favoritesOnly &&
          selectedGroup !==
            "All" &&
          channel.group !==
            selectedGroup
        ){
          return false;
        }

        if(
          query &&
          !channel.name
            .toLowerCase()
            .includes(query) &&
          !channel.group
            .toLowerCase()
            .includes(query)
        ){
          return false;
        }

        return true;
      }
    );
}


/* =====================================================
   CHANNEL LIST
===================================================== */

function renderChannels(){

  const visible =
    getVisibleChannels();

  channelCount.textContent =
    visible.length +
    " channels";

  channelsBox.innerHTML =
    "";

  if(!visible.length){

    channelsBox.innerHTML =
      '<div class="empty">No channels found.<br>Try another category or search.</div>';

    return;
  }

  const fragment =
    document.createDocumentFragment();

  visible.forEach(
    ({channel,index}) => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "channel";

      row.dataset.index =
        index;

      if(
        index ===
        currentIndex
      ){
        row.classList.add(
          "active"
        );
      }

      if(
        favorites.has(
          channel.url
        )
      ){
        row.classList.add(
          "favorite"
        );
      }

      let logo;

      if(channel.logo){

        logo =
          document.createElement(
            "img"
          );

        logo.className =
          "ch-logo";

        logo.src =
          channel.logo;

        logo.loading =
          "lazy";

        logo.onerror =
          () => {

            logo.replaceWith(
              makeFallback(
                channel.name,
                "ch-fallback"
              )
            );
          };

      }else{

        logo =
          makeFallback(
            channel.name,
            "ch-fallback"
          );
      }


      const info =
        document.createElement(
          "div"
        );

      info.className =
        "ch-info";


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "ch-name";

      name.textContent =
        channel.name;


      const group =
        document.createElement(
          "div"
        );

      group.className =
        "ch-group";

      group.textContent =
        channel.group;


      const live =
        document.createElement(
          "div"
        );

      live.className =
        "ch-live";

      live.textContent =
        "LIVE";


      const star =
        document.createElement(
          "div"
        );

      star.className =
        "ch-star";

      star.textContent =
        "★";


      info.appendChild(name);

      info.appendChild(group);

      row.appendChild(logo);

      row.appendChild(info);

      row.appendChild(live);

      row.appendChild(star);


      row.onclick =
        () =>
          playChannel(
            index,
            true
          );


      fragment.appendChild(
        row
      );
    }
  );

  channelsBox.appendChild(
    fragment
  );
}


function makeFallback(
  name,
  className
){

  const box =
    document.createElement(
      "div"
    );

  box.className =
    className;

  box.textContent =
    (
      name || "TV"
    )
      .charAt(0)
      .toUpperCase();

  return box;
}


/* =====================================================
   NOW PLAYING
===================================================== */

function updateNow(channel){

  nowLogoBox.innerHTML =
    "";

  let logo;

  if(channel.logo){

    logo =
      document.createElement(
        "img"
      );

    logo.className =
      "now-logo";

    logo.src =
      channel.logo;

    logo.onerror =
      () => {

        logo.replaceWith(
          makeFallback(
            channel.name,
            "now-fallback"
          )
        );
      };

  }else{

    logo =
      makeFallback(
        channel.name,
        "now-fallback"
      );
  }

  nowLogoBox.appendChild(
    logo
  );

  nowName.textContent =
    channel.name;

  nowMeta.textContent =
    channel.group +
    " • Live TV";

  controlName.textContent =
    channel.name;

  controlStatus.textContent =
    "Connecting...";

  playerInfo.style.display =
    "flex";

  updateFavoriteButton();
}


/* =====================================================
   AUDIO
===================================================== */

function savedVolume(){

  const stored =
    Number(
      localStorage.getItem(
        "premiumTVVolume"
      )
    );

  if(
    Number.isFinite(stored) &&
    stored > 0 &&
    stored <= 1
  ){
    return stored;
  }

  return .8;
}


function enableAudio(){

  const level =
    savedVolume();

  video.muted = false;

  video.volume =
    level;

  volume.value =
    level;

  updateAudioIcons();
}


function updateAudioIcons(){

  const muted =
    video.muted ||
    video.volume === 0;

  const icon =
    muted
      ? "🔇"
      : "🔊";

  muteButton.textContent =
    icon;

  overlayMute.textContent =
    icon;
}


function toggleMute(){

  if(
    video.muted ||
    video.volume === 0
  ){

    video.muted = false;

    if(video.volume === 0){
      video.volume =
        savedVolume();
    }

  }else{

    video.muted = true;
  }

  updateAudioIcons();
}


/* =====================================================
   PLAY CHANNEL
===================================================== */

function playChannel(
  index,
  userAction = true
){
  document.body.classList.remove("idle");

  const channel =
    channels[index];

  if(!channel){
    return;
  }

  playbackSession++;

  const session =
    playbackSession;

  currentIndex =
    index;

  focusedIndex =
    index;

  recoveryCount = 0;

  localStorage.setItem(
    "premiumTVLastChannel",
    channel.url
  );

  hideError();

  placeholder.style.display =
    "none";

  liveBadge.style.display =
    "none";

  updateNow(channel);

  renderChannels();

  showLoader(
    "Connecting..."
  );


  /*
    Channel click is a user gesture,
    so restore sound here.
  */

  if(userAction){
    enableAudio();
  }


  startStream(
    channel,
    session,
    userAction
  );
}


/* =====================================================
   HLS PLAYBACK
===================================================== */

function startStream(
  channel,
  session,
  userAction
){

  destroyPlayer();

  const source =
    proxyURL(
      channel.url,
      channel.ua,
      channel.referer
    );


  if(
    window.Hls &&
    Hls.isSupported()
  ){

    hls =
      new Hls({

        enableWorker:true,

        lowLatencyMode:false,

        backBufferLength:30,

        maxBufferLength:30,

        maxMaxBufferLength:60,

        manifestLoadingTimeOut:
          20000,

        manifestLoadingMaxRetry:
          3,

        levelLoadingTimeOut:
          20000,

        levelLoadingMaxRetry:
          3,

        fragLoadingTimeOut:
          25000,

        fragLoadingMaxRetry:
          4
      });


    hls.attachMedia(
      video
    );


    hls.on(
      Hls.Events.MEDIA_ATTACHED,
      () => {

        if(
          session !==
          playbackSession
        ){
          return;
        }

        hls.loadSource(
          source
        );
      }
    );


    hls.on(
      Hls.Events.MANIFEST_PARSED,
      async () => {

        if(
          session !==
          playbackSession
        ){
          return;
        }

        try{

          if(userAction){
            enableAudio();
          }

          await video.play();

          hideLoader();

          hideError();

          liveBadge.style.display =
            "flex";

          controlStatus.textContent =
            channel.group +
            " • LIVE";

          playButton.textContent =
            "❚❚";

          topStatus.textContent =
            "Watching " +
            channel.name;

        }catch{

          /*
            Browser blocked autoplay.
            Do not force mute.
          */

          hideLoader();

          controlStatus.textContent =
            "Press Play to start";

          playButton.textContent =
            "▶";
        }
      }
    );


    hls.on(
      Hls.Events.ERROR,
      (event,data) => {

        if(
          session !==
          playbackSession
        ){
          return;
        }

        if(!data.fatal){
          return;
        }


        if(
          data.type ===
          Hls.ErrorTypes.MEDIA_ERROR &&
          recoveryCount < 2
        ){

          recoveryCount++;

          controlStatus.textContent =
            "Recovering...";

          try{
            hls.recoverMediaError();
            return;
          }catch{}
        }


        if(
          data.type ===
          Hls.ErrorTypes.NETWORK_ERROR &&
          recoveryCount < 2
        ){

          recoveryCount++;

          controlStatus.textContent =
            "Reconnecting...";

          try{
            hls.startLoad();
            return;
          }catch{}
        }


        hideLoader();

        liveBadge.style.display =
          "none";

        controlStatus.textContent =
          "Currently unavailable";

        showError(
          "This channel is currently unavailable. Try another channel."
        );
      }
    );


  }else if(
    video.canPlayType(
      "application/vnd.apple.mpegurl"
    )
  ){

    video.src =
      source;

    if(userAction){
      enableAudio();
    }

    video.play()
      .then(
        () => {

          hideLoader();

          liveBadge.style.display =
            "flex";

          playButton.textContent =
            "❚❚";
        }
      )
      .catch(
        () => {

          hideLoader();

          controlStatus.textContent =
            "Press Play to start";
        }
      );

  }else{

    hideLoader();

    showError(
      "Live playback is not supported by this browser."
    );
  }
}


function destroyPlayer(){

  if(hls){

    try{
      hls.destroy();
    }catch{}

    hls = null;
  }

  try{
    video.pause();
    video.removeAttribute("src");
    video.load();
  }catch{}
}


/* =====================================================
   CONTROLS
===================================================== */

async function togglePlay(){

  if(currentIndex < 0){
    return;
  }

  if(video.paused){

    /*
      Play button is user interaction:
      enable audio safely.
    */

    enableAudio();

    try{

      await video.play();

      playButton.textContent =
        "❚❚";

    }catch{}

  }else{

    video.pause();

    playButton.textContent =
      "▶";
  }
}


function nextChannel(){

  if(!channels.length){
    return;
  }

  const next =
    currentIndex < 0
      ? 0
      : (
          currentIndex + 1
        ) %
        channels.length;

  playChannel(
    next,
    true
  );
}


function previousChannel(){

  if(!channels.length){
    return;
  }

  const previous =
    currentIndex <= 0
      ? channels.length - 1
      : currentIndex - 1;

  playChannel(
    previous,
    true
  );
}


async function toggleFullscreen(){

  const player =
    document.getElementById(
      "player"
    );

  try{

    if(
      document.fullscreenElement
    ){

      await document
        .exitFullscreen();

    }else{

      await player
        .requestFullscreen();
    }

  }catch{}
}


/* =====================================================
   FAVORITES
===================================================== */

function saveFavorites(){

  localStorage.setItem(
    "premiumTVFavorites",
    JSON.stringify(
      [...favorites]
    )
  );
}


function toggleFavoriteCurrent(){

  if(currentIndex < 0){
    return;
  }

  const channel =
    channels[currentIndex];

  if(
    favorites.has(
      channel.url
    )
  ){

    favorites.delete(
      channel.url
    );

  }else{

    favorites.add(
      channel.url
    );
  }

  saveFavorites();

  updateFavoriteButton();

  renderChannels();
}


function updateFavoriteButton(){

  if(currentIndex < 0){
    return;
  }

  const active =
    favorites.has(
      channels[currentIndex].url
    );

  favoriteNow.textContent =
    active
      ? "★"
      : "☆";

  favoriteNow.classList.toggle(
    "fav-on",
    active
  );
}


/* =====================================================
   SEARCH
===================================================== */

search.addEventListener(
  "input",
  () => {

    clearSearchButton.style.display =
      search.value
        ? "flex"
        : "none";

    renderChannels();
  }
);


function clearSearch(){

  search.value = "";

  clearSearchButton.style.display =
    "none";

  renderChannels();

  search.focus();
}


/* =====================================================
   VOLUME
===================================================== */

volume.addEventListener(
  "input",
  () => {

    const value =
      Number(
        volume.value
      );

    video.volume =
      value;

    video.muted =
      value === 0;

    if(value > 0){

      localStorage.setItem(
        "premiumTVVolume",
        value
      );
    }

    updateAudioIcons();
  }
);


video.addEventListener(
  "volumechange",
  () => {

    volume.value =
      video.volume;

    if(
      video.volume > 0 &&
      !video.muted
    ){

      localStorage.setItem(
        "premiumTVVolume",
        video.volume
      );
    }

    updateAudioIcons();
  }
);


/* =====================================================
   VIDEO EVENTS
===================================================== */

video.addEventListener(
  "playing",
  () => {

    hideLoader();

    hideError();

    liveBadge.style.display =
      "flex";

    playButton.textContent =
      "❚❚";
  }
);


video.addEventListener(
  "pause",
  () => {

    playButton.textContent =
      "▶";
  }
);


video.addEventListener(
  "waiting",
  () => {

    if(currentIndex >= 0){

      showLoader(
        "Buffering..."
      );

      controlStatus.textContent =
        "Buffering...";
    }
  }
);


/* =====================================================
   KEYBOARD / TV REMOTE
===================================================== */

function moveFocus(direction){

  const visible =
    getVisibleChannels();

  if(!visible.length){
    return;
  }

  let position =
    visible.findIndex(
      item =>
        item.index ===
        focusedIndex
    );

  if(position < 0){
    position = 0;
  }else{
    position += direction;
  }

  if(position < 0){
    position =
      visible.length - 1;
  }

  if(
    position >=
    visible.length
  ){
    position = 0;
  }

  focusedIndex =
    visible[position].index;

  document
    .querySelectorAll(
      ".channel"
    )
    .forEach(
      item =>
        item.classList.remove(
          "focused"
        )
    );

  const element =
    document.querySelector(
      '.channel[data-index="' +
      focusedIndex +
      '"]'
    );

  if(element){

    element.classList.add(
      "focused"
    );

    element.scrollIntoView({
      block:"nearest"
    });
  }
}


document.addEventListener(
  "keydown",
  event => {

    /*
      Don't hijack arrows while typing search.
    */

    if(
      document.activeElement ===
      search
    ){

      if(
        event.key ===
        "Escape"
      ){

        search.blur();
      }

      return;
    }


    if(
      event.key ===
      "ArrowDown"
    ){

      event.preventDefault();

      moveFocus(1);

      return;
    }


    if(
      event.key ===
      "ArrowUp"
    ){

      event.preventDefault();

      moveFocus(-1);

      return;
    }


    if(
      event.key ===
      "Enter" &&
      focusedIndex >= 0
    ){

      event.preventDefault();

      playChannel(
        focusedIndex,
        true
      );

      return;
    }


    if(
      event.code ===
      "Space"
    ){

      event.preventDefault();

      togglePlay();

      return;
    }


    if(
      event.key.toLowerCase() ===
      "m"
    ){

      toggleMute();

      return;
    }


    if(
      event.key.toLowerCase() ===
      "f"
    ){

      toggleFullscreen();

      return;
    }


    if(
      event.key === "/"
    ){

      event.preventDefault();

      search.focus();
    }
  }
);



/* =====================================================
   CLOSE PLAYER (back to channel grid)
===================================================== */

function closePlayer(){
  if(document.fullscreenElement){
    try{ document.exitFullscreen(); }catch{}
  }
  playbackSession++;
  destroyPlayer();
  currentIndex = -1;
  focusedIndex = -1;
  hideLoader();
  hideError();
  liveBadge.style.display = "none";
  playerInfo.style.display = "none";
  placeholder.style.display = "flex";
  playButton.textContent = "▶";
  controlName.textContent = "Live TV Ready";
  controlStatus.textContent = "Select a channel";
  topStatus.textContent = channels.length + " channels";
  document.body.classList.add("idle");
  renderChannels();
}

document.addEventListener("keydown", e => {
  if(e.key === "Escape" && document.activeElement !== search && !document.fullscreenElement){
    closePlayer();
  }
});

/* =====================================================
   START
===================================================== */

window.addEventListener(
  "DOMContentLoaded",
  () => {

    /*
      IMPORTANT:
      Do not restore a saved muted state.
      Start with normal volume.
    */

    const initialVolume =
      savedVolume();

    video.volume =
      initialVolume;

    video.muted =
      false;

    volume.value =
      initialVolume;

    updateAudioIcons();

    loadTV();
  }
);

</script>
